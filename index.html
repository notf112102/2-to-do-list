<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="icon" href="./imgs/logo.png">
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="to-do-list">
        <div class="text">
            <h1>To-Do List</h1>
            <img src="./imgs/logo.png" alt="logo">
        </div>
        <div class="tools">
            <input type="text" id="list" placeholder="Add your task" autofocus>
            <button id="btn_add">Add</button>
        </div>
        <div class="task" id="task"></div>
    </div>
    <script src="./js/index.js"></script>
</body>
</html>
